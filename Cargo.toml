[workspace]
resolver = "2"
members = ["crates/jeuvoice-core", "crates/jeuvoice-whisper", "crates/jeuvoice-app", "crates/jeuvoice-engine-client", "crates/jeuvoice-kaggle", "crates/jeuvoice-gpu"]
# jeuvoice-gpu needs the cuda-oxide tools (scripts\cargo.cmd oxide ...). Plain `cargo build`
# and `cargo test` leave it out, so the app builds without those tools.
default-members = ["crates/jeuvoice-core", "crates/jeuvoice-whisper", "crates/jeuvoice-app", "crates/jeuvoice-engine-client", "crates/jeuvoice-kaggle"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"

# Keep dev target/ small: line tables for our own crates (backtraces keep file
# and line numbers), no debuginfo for third-party dependencies (the bulk of the
# 40+ GB debug/ bloat: DWARF in deps/ plus debuginfo-heavy incremental caches).
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.dev.package.jeuvoice-core]
debug = 1
[profile.dev.package.jeuvoice-whisper]
debug = 1
[profile.dev.package.jeuvoice-app]
debug = 1
[profile.dev.package.jeuvoice-engine-client]
debug = 1
[profile.dev.package.jeuvoice-kaggle]
debug = 1
[profile.dev.package.jeuvoice-gpu]
debug = 1

# `cargo test` inherits dev, but spell it out so test builds stay lean too.
[profile.test.package."*"]
debug = false

[profile.test.package.jeuvoice-core]
debug = 1
[profile.test.package.jeuvoice-whisper]
debug = 1
[profile.test.package.jeuvoice-app]
debug = 1
[profile.test.package.jeuvoice-engine-client]
debug = 1
[profile.test.package.jeuvoice-kaggle]
debug = 1
[profile.test.package.jeuvoice-gpu]
debug = 1

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "b3a33a0f3a5c35d78f188046a040696193cfb6bf" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "mkv", "ogg", "vorbis", "flac", "wav", "pcm"] }
rubato = "0.16"
hound = "3.5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
opuscule = "0.2.2"
similar = "2"
whisper-rs = { version = "=0.16.0", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
directories = "5"
# NVIDIA CUDA Rust (cuda-oxide). Alpha: pinned to one commit. See docs/superpowers/specs/2026-11-24-rust-cuda-inference-design.md.
cuda-core = { git = "https://github.com/NVIDIA/cuda-rust", rev = "5e5c77b19a4b3204d6542bab2f0fde2a4eed824b" }
cuda-device = { git = "https://github.com/NVIDIA/cuda-rust", rev = "5e5c77b19a4b3204d6542bab2f0fde2a4eed824b" }
cuda-host = { git = "https://github.com/NVIDIA/cuda-rust", rev = "5e5c77b19a4b3204d6542bab2f0fde2a4eed824b" }
half = "2"
libloading = "0.8"
safetensors = "0.6"
libm = "0.2"
