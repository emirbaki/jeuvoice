[workspace]
resolver = "2"
members = ["crates/jeuvoice-core", "crates/jeuvoice-whisper", "crates/jeuvoice-app"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "b3a33a0f3a5c35d78f188046a040696193cfb6bf" }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm"] }
rubato = "0.16"
hound = "3.5"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
opuscule = "0.2.2"
