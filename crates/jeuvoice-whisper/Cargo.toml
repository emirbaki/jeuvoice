[package]
name = "jeuvoice-whisper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
jeuvoice-core = { path = "../jeuvoice-core" }
whisper-rs.workspace = true
ureq.workspace = true
directories.workspace = true
half.workspace = true
jeuvoice-gpu = { path = "../jeuvoice-gpu", optional = true }

[features]
# The Whisper GPU path on Rust kernels (crates/jeuvoice-gpu). Build and test it only with
# scripts\cargo.cmd oxide ... --features cuda-kernels
cuda-kernels = ["dep:jeuvoice-gpu"]

[dev-dependencies]
tempfile.workspace = true
safetensors.workspace = true
serde_json = "1"

[target.'cfg(windows)'.dependencies]
whisper-rs = { workspace = true, features = ["cuda"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal"] }

[[example]]
name = "compare_whisper"
required-features = ["cuda-kernels"]
