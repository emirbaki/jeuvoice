[package]
name = "jeuvoice-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
arboard = "3"
sha2 = "0.10"
hound = "3"
jeuvoice-core = { path = "../jeuvoice-core" }
jeuvoice-whisper = { path = "../jeuvoice-whisper" }
jeuvoice-engine-client = { path = "../jeuvoice-engine-client" }
jeuvoice-kaggle = { path = "../jeuvoice-kaggle" }
cpal = "0.15"
directories.workspace = true
keyring = "3"
serde.workspace = true
serde_json = "1"

[dev-dependencies]
tempfile.workspace = true

# Read by cargo-packager (Plan 4 Task 5 builds the NSIS installer from this).
# collect.ps1 makes dist\windows\JeuVoice; the installer packs that folder.
[package.metadata.packager]
productName = "JeuVoice"
identifier = "com.jeu.jeuvoice"
description = "Speech, transcription and voice training in one window."
