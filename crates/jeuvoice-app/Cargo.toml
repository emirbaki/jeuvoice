[package]
name = "jeuvoice-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rune = { workspace = true, features = ["native-file-dialog"] }
arboard = "3"
sha2 = "0.10"
hound = "3"
jeuvoice-core = { path = "../jeuvoice-core" }
jeuvoice-whisper = { path = "../jeuvoice-whisper" }
jeuvoice-engine-client = { path = "../jeuvoice-engine-client" }
jeuvoice-kaggle = { path = "../jeuvoice-kaggle" }
cpal = "0.15"
directories.workspace = true
keyring = "3"
serde.workspace = true
serde_json = "1"

[features]
# The Whisper GPU path on Rust kernels. The release build turns it on. The app then tries
# CudaWhisper only with JEUVOICE_CUDA_WHISPER=1, and whisper.cpp otherwise.
cuda-kernels = ["jeuvoice-whisper/cuda-kernels"]

[dev-dependencies]
tempfile.workspace = true

# keyring 3 ships no backend by default; without a platform feature every
# Entry::new fails, so the Hugging Face token is never saved.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[build-dependencies]
winresource = "0.1"

# Read by cargo-packager: `cargo packager -p jeuvoice-app --release` from the
# repo root (scripts\make-installer.cmd does this). The bundle comes first from
# packaging\windows\collect.ps1. cargo-packager changes to this crate folder,
# so every path below is relative to crates\jeuvoice-app.
[package.metadata.packager]
productName = "JeuVoice"
identifier = "com.jeu.jeuvoice"
description = "Speech, transcription and voice training in one window."
outDir = "../../dist/windows"
binariesDir = "../../dist/windows/JeuVoice"
formats = ["nsis"]
# The app exe embeds the same icon through build.rs.
icons = ["../../packaging/windows/icon.ico"]
resources = [
    "../../dist/windows/JeuVoice/*.dll",
    "../../dist/windows/JeuVoice/python-3.12.16-20261110.tar.gz",
    "../../dist/windows/JeuVoice/requirements-win-cu126.txt",
    "../../dist/windows/JeuVoice/uv.exe",
    "../../dist/windows/JeuVoice/engine",
    "../../dist/windows/JeuVoice/assets",
]

[package.metadata.packager.nsis]
# Per-user install, no admin: %LOCALAPPDATA%\Programs\JeuVoice (see the template).
installMode = "currentUser"
# The CUDA DLLs do not compress much; zlib keeps the build fast.
compression = "zlib"
# The uninstaller asks about this folder; the default is to keep it.
appdataPaths = ['$APPDATA\Jeu\JeuVoice']
# A copy of the stock template with the install folder and the uninstall
# question changed. See the comments at its top.
template = "../../packaging/windows/installer.nsi"
# Without this, NSIS keeps its own blue setup icon; `icons` alone is not enough.
installerIcon = "../../packaging/windows/icon.ico"
