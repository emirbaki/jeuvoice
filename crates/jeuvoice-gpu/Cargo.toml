[package]
name = "jeuvoice-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPU base for JeuVoice inference: Rust CUDA kernels (cuda-oxide), cuBLAS, buffers, test and benchmark helpers."

# Build and test only through the cuda-oxide backend:
#   scripts\cargo.cmd oxide test -- -p jeuvoice-gpu
[lib]
# No unit-test build of the library. cuda-oxide writes the device PTX of a crate to one
# file per crate name. Cargo builds the lib and the lib test at the same time, so the two
# builds wrote and read the same file and one failed ("embedded artifact payload is
# empty"). All tests are in tests/ and use the one library build.
test = false

[dependencies]
cuda-core.workspace = true
cuda-device.workspace = true
cuda-host.workspace = true
half.workspace = true
libloading.workspace = true
