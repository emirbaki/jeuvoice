[project]
name = "jeuvoice-engine"
version = "0.1.0"
description = "JeuVoice voice engine (OmniVoice + tr2 LoRA) over local HTTP"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub",
    "datasets",
    "soundfile",
    "numpy",
    "scipy",
    "librosa",
]
# NOTE: datasets decodes Audio-typed columns through torchcodec, whose Windows
# wheels currently fail to load in this venv. The pipeline below only needs file
# paths (soundfile reads those), so torchcodec stays out until Hub audio columns
# are actually used.

[project.optional-dependencies]
cuda = [
    "torch==2.14.0",
    "transformers==5.19.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
]
test = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The lock-file venv has no editable install: import the package from here.
pythonpath = ["."]
markers = ["gpu: needs the model and --gpu on this machine"]
